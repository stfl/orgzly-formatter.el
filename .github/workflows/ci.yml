name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7 # master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Eask
        uses: emacs-eask/setup-eask@5e7d164250e4b5e438fb02a21b57d001a3b189b2 # master
        with:
          version: snapshot

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check version agreement
        run: just check-version

      - name: Byte-compile
        run: just compile

      - name: Lint
        run: just lint

      - name: Run ERT tests
        run: just test
